name: Build How to MUKBANG Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache Godot's imported textures and Android export templates so repeat builds skip expensive work.
      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imports-4.4.1-${{ hashFiles('project.godot', 'assets/textures/**', 'assets/models/**') }}

      - name: Cache Godot Android export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-android-templates-4.4.1

      - name: Cache generated Android Gradle template
        uses: actions/cache@v4
        with:
          path: android/build
          key: godot-android-gradle-template-4.4.1-v1

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android platform packages
        shell: bash
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          GODOT_VERSION="4.4.1"
          curl -L --fail -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L --fail -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"

      - name: Configure Godot Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Android export preset
        shell: bash
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/How-to-MUKBANG-0.2.0-beta.2.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=24
          gradle_build/target_sdk=34
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          package/unique_name="org.sinrok.howtomukbang"
          package/name="How to MUKBANG"
          package/signed=true
          package/app_category=0
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true
          version/code=2
          version/name="0.2.0-beta.2"
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          permissions/internet=false
          EOF
          mkdir -p build

      - name: Start Android Debug Bridge
        run: adb start-server

      - name: Validate project and import assets
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          # On this runner Godot may finish importing and then hang while loading
          # editor layout. Cap that editor-only tail so the Android job cannot stall.
          timeout --verbose --signal=TERM --kill-after=10s 2m \
            godot --headless --editor --path . --import --quit
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::Godot import process exceeded 2 minutes; continuing to resource validation and export."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Install project Android build template
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # Unpack the Android source template directly. Calling the editor to
          # install it can hang on "Loading editor layout" in headless CI.
          template_zip="$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          if [ -f android/build/build.gradle ] || [ -f android/build/build.gradle.kts ]; then
            echo "Android Gradle build template is already present."
          elif [ -f "$template_zip" ]; then
            mkdir -p android/build
            unzip -q -o "$template_zip" -d android/build
          else
            echo "::error::Android source template not found at $template_zip"
            find "$HOME/.local/share/godot/export_templates/4.4.1.stable" -maxdepth 2 -type f -print 2>/dev/null | head -100 || true
            exit 1
          fi

          if [ ! -f android/build/build.gradle ] && [ ! -f android/build/build.gradle.kts ]; then
            echo "::error::Android template archive did not produce android/build/build.gradle(.kts)."
            echo "Contents of android/build (if present):"
            find android/build -maxdepth 3 -type f -print 2>/dev/null | head -100 || true
            exit 1
          fi
          echo "Android Gradle build template is ready."

      - name: Validate 4K PBR texture imports
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=15s 4m godot --headless --path . --script res://scripts/validate_pbr.gd

      - name: Export Android APK
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 11m godot --headless --path . --export-debug "Android" build/How-to-MUKBANG-0.2.0-beta.2.apk 2>&1 | tee build/android-export.log
          test -s build/How-to-MUKBANG-0.2.0-beta.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: How-to-MUKBANG-0.2.0-beta.2
          path: build/How-to-MUKBANG-0.2.0-beta.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish first GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: build/How-to-MUKBANG-0.2.0-beta.2.apk
        shell: bash
        run: |
          TAG="v0.2.0-beta.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the published release unchanged."
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "How to MUKBANG 0.2.0-beta.2" \
              --notes "First public Android prerelease of How to MUKBANG. Includes the expanded rainy-night mall, walk-in street shops, food ordering and serving, eating animations, and food-specific procedural bite sounds. This is a beta build; please report bugs." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
